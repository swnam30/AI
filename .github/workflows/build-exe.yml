name: Build Windows EXE

on:
  push:
    branches:
      - "claude/port-scanner-exe-b25kju"
    paths:
      - "port_scanner.py"
      - ".github/workflows/build-exe.yml"
  workflow_dispatch:

concurrency:
  group: build-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build EXE
        timeout-minutes: 10
        run: python -m PyInstaller --onefile --console --name PortScanner port_scanner.py

      - name: Smoke test
        timeout-minutes: 2
        run: dist\PortScanner.exe --version

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: PortScanner-windows-exe
          path: dist/PortScanner.exe
          if-no-files-found: error
